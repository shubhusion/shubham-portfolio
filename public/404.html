    <style>
      :root {
        --ink: #0a0a0f;
        --paper: #f5f3ff;
        --violet: #7c3aed;
        --violet-light: #a78bfa;
        --blue: #60a5fa;
      }
      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; cursor: none; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 6rem 1.5rem;
        background: var(--ink);
        color: var(--paper);
        font-family: 'Inter', sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .wrap { width: 100%; max-width: 42rem; text-align: center; }
      .kicker {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--violet-light);
        margin-bottom: 1.5rem;
      }
      h1 {
        font-family: 'Syne', sans-serif;
        font-weight: 800;
        font-size: clamp(2.5rem, 8vw, 4rem);
        line-height: 1;
        letter-spacing: -0.03em;
        margin: 0 0 1.5rem;
      }
      .grad {
        background: linear-gradient(135deg, var(--violet-light) 0%, var(--blue) 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      p {
        color: rgba(245, 243, 255, 0.6);
        font-weight: 300;
        line-height: 1.7;
        margin: 0 0 2.5rem;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        justify-content: center;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.9rem 1.75rem;
        border-radius: 999px;
        font-family: 'Syne', sans-serif;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        transition: transform 0.2s ease, background-color 0.2s ease;
      }
      .btn:hover { transform: translateY(-2px); }
      .btn-primary {
        background: linear-gradient(135deg, var(--violet), #6d28d9);
        color: #ffffff;
      }
      .btn-secondary {
        border: 1px solid rgba(167, 139, 250, 0.3);
        color: var(--violet-light);
      }
      @media (hover: none), (prefers-reduced-motion: reduce) {
        html { cursor: auto; scroll-behavior: auto; }
        .btn { transition: none; }
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <div class="kicker">404</div>
      <h1>Page not<br /><span class="grad">found.</span></h1>
      <p>The route you requested doesn't exist. Head back to the homepage or explore the projects.</p>
      <div class="actions">
        <a class="btn btn-primary" href="/">Back to homepage <span aria-hidden="true">↗</span></a>
        <a class="btn btn-secondary" href="/#projects">View projects</a>
      </div>
    </main>
  </body>
</html>
